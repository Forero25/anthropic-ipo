name: Datos y resultados
on:
  push:
    branches: [main]
    paths: ["ingesta/**", "analisis/**", "entradas/**", "tests/**", ".github/workflows/**", "requirements.txt"]
  schedule:
    - cron: "23 22 * * 1-5"   # después del cierre de Nueva York
  workflow_dispatch:
permissions:
  contents: write
concurrency: {group: diario, cancel-in-progress: false}
jobs:
  correr:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      # Los precios de 1 minuto se acumulan en la caché del flujo, no en el repositorio:
      # Yahoo solo guarda unos 30 días y los precios no se publican.
      - uses: actions/cache@v4
        with:
          path: datos
          key: datos-${{ github.run_id }}
          restore-keys: datos-
      - run: pip install -r requirements.txt pytest
      - run: pytest -q
      - run: python ingesta/precios.py
      - name: Factores de Fama y French (no bloquea si la biblioteca no responde)
        run: python ingesta/factores.py || echo "factores no disponibles hoy"
      - name: Prospecto final en EDGAR
        env: {SEC_USER_AGENT: "${{ secrets.SEC_USER_AGENT }}"}
        run: if [ -n "$SEC_USER_AGENT" ]; then python ingesta/edgar.py; else echo "falta el secreto SEC_USER_AGENT"; fi
      - name: Estadísticas históricas de Ritter
        run: sudo apt-get install -y -qq poppler-utils >/dev/null && python ingesta/ritter.py || echo "Ritter no disponible"
      - run: python analisis/correr.py
      - name: Guardar resultados
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add resultados/
          git diff --cached --quiet || (git commit -m "Resultados actualizados" && git pull --rebase -X theirs && git push)
